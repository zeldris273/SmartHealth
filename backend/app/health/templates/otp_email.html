<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Xác Thực OTP</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; border: 1px solid #eee;">
        <h2>Chào bạn,</h2>
        <p>Mã OTP để xác thực tài khoản SmartHealth của bạn là:</p>
        <p style="font-size: 32px; font-weight: bold; letter-spacing: 5px; color: #2ecc71; text-align: center; margin: 20px 0;">
            {{ otp_code }}
        </p>
        <p>Mã này sẽ hết hạn sau vài phút. Vui lòng không chia sẻ mã này cho bất kỳ ai.</p>
    </div>
</body>
</html>
